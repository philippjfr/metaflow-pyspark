[project]
site_name = "metaflow-spark"
site_description = "Spark and Databricks decorators for Metaflow"
site_author = "Outerbounds"
site_url = "https://outerbounds.github.io/metaflow-pyspark/"
site_dir = "builtdocs"
repo_url = "https://github.com/outerbounds/metaflow-pyspark"
repo_name = "outerbounds/metaflow-pyspark"
edit_uri = "edit/main/docs/"
nav = [
  {"Home" = "index.md"},
  {"Quickstart" = "quickstart.md"},
  {"How-to" = [
    {"Choose a Backend" = "how-to/choose-a-backend.md"},
    {"Session or Job Style" = "how-to/session-vs-job.md"},
    {"Configure Compute and Credentials" = "how-to/configuration.md"},
    {"Choose an Output Format" = "how-to/output-formats.md"},
    {"Read & Write Unity Catalog Tables" = "how-to/unity-catalog.md"},
    {"Attribute Cost" = "how-to/cost-attribution.md"},
    {"Handle Failures & Cancellation" = "how-to/failures-and-cancellation.md"},
    {"Migrate from @pyspark" = "how-to/migrate-from-pyspark.md"}
  ]},
  {"Tutorials" = [
    {"Gallery" = "tutorials/index.md"},
    {"Hello Spark: One Flow, Three Backends" = "tutorials/hello-spark.md"},
    {"Unity Catalog Governance" = "tutorials/unity-catalog-governance.md"},
    {"Reading Without a Cluster" = "tutorials/no-cluster.md"},
    {"Orchestrating Existing Jobs" = "tutorials/existing-jobs.md"},
    {"Cost Attribution" = "tutorials/cost-attribution.md"}
  ]},
  {"Reference" = "reference/index.md"}
]

# Theme configuration
[project.theme]
variant = "modern"  # Use "classic" if you want the Material for MkDocs look
features = [
  "announce.dismiss",
  "content.action.edit",
  "content.action.view",
  "content.code.annotate",
  "content.code.copy",
  "content.tooltips",
  "navigation.footer",
  "navigation.indexes",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.instant.progress",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "search.share",
  "search.suggest",
  "toc.follow"
]

# Color palette
[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "custom"
accent = "blue"

[project.theme.palette.toggle]
icon = "material/brightness-7"
name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "custom"
accent = "black"

[project.theme.palette.toggle]
icon = "material/brightness-4"
name = "Switch to light mode"

# Markdown extensions
[project.markdown_extensions.toc]
permalink = true

[project.markdown_extensions.pymdownx.highlight]
anchor_linenums = true
line_spans = "__span"
pygments_lang_class = true

[project.markdown_extensions.pymdownx.superfences]

[project.markdown_extensions.pymdownx.tasklist]
custom_checkbox = true

[project.markdown_extensions.pymdownx.inlinehilite]

[project.markdown_extensions.admonition]

[project.markdown_extensions.pymdownx.snippets]
url_download = true
base_path = ["."]

[project.markdown_extensions.pymdownx.tabbed]
alternate_style = true

[project.markdown_extensions.pymdownx.emoji]
emoji_index = "zensical.extensions.emoji.twemoji"
emoji_generator = "zensical.extensions.emoji.to_svg"

[project.markdown_extensions.attr_list]

[project.markdown_extensions.md_in_html]

[project.markdown_extensions.abbr]

[project.markdown_extensions.def_list]

# Plugins
[project.plugins]
search = {}
typeset = {}
literate_nav = {}

[project.plugins.mkdocstrings.handlers.python]
paths = ["."]

[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "numpy"
show_if_no_docstring = true
filters = ["!^_"]

# Extra configuration
[project.extra]

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/outerbounds/metaflow-pyspark"

[[project.extra.social]]
icon = "fontawesome/brands/python"
link = "https://pypi.org/project/metaflow-spark/"
