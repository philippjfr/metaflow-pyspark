[workspace]
name = "metaflow-spark"
channels = ["conda-forge"]
platforms = ["osx-arm64", "osx-64", "linux-64", "win-64"]

[environments]
docs = ["docs"]

# =============================================
# ==================== DOCS ===================
# =============================================

[feature.docs.dependencies]
python = ">=3.10"
pip = "*"
setuptools = ">=61"
zensical = "<0.0.17"
mkdocstrings = "*"
mkdocstrings-python = "*"
mkdocs-gen-files = "*"
mkdocs-literate-nav = "*"

[feature.docs.tasks]
postinstall = "pip install --no-build-isolation --no-deps --disable-pip-version-check -e ."
docs-build = { cmd = "zensical build --clean", depends-on = ["postinstall"] }
docs-serve = { cmd = "zensical serve", depends-on = ["postinstall"] }
docs-clean = "rm -rf builtdocs"
